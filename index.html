<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>重訓紀錄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1ee;--card:#fbfcfb;--ink:#17292a;--mute:#5d706f;--line:#d3dcd8;--acc:#0f6b63;--acc-ink:#fff;--plate:#b8780a;--danger:#b3372c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101716;--card:#182321;--ink:#e6efec;--mute:#93a8a4;--line:#2b3b38;--acc:#3fb7a9;--acc-ink:#07201d;--plate:#e5ab3c;--danger:#ef7d70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101716;--card:#182321;--ink:#e6efec;--mute:#93a8a4;--line:#2b3b38;--acc:#3fb7a9;--acc-ink:#07201d;--plate:#e5ab3c;--danger:#ef7d70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 56px}
h2{font-size:18px;margin:0}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
button.link{border:0;background:none;color:var(--mute);min-height:36px;padding:4px 8px;font-size:14px}
button.dl{border:0;background:none;color:var(--danger);margin-right:auto}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs button{font-weight:700;min-height:48px;padding:6px}
.tabs button.on,.chip.on,.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prow{padding:6px 0;border-radius:8px}.pl{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.cw{display:flex;flex-wrap:wrap;gap:8px;min-height:8px}
.chip{border-radius:999px;min-height:42px;padding:8px 16px}.chip.on{font-weight:700}
.org .chip{touch-action:none;cursor:grab;border-style:dashed}.org .cw{min-height:46px}
.hot{outline:2px solid var(--acc);outline-offset:2px;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;min-height:40px;padding:6px 16px}
.steps{display:grid;gap:10px;margin:12px 0}
.stb{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}.stb button{font-size:24px;padding:0}.stb input{text-align:center;font-size:22px;font-weight:700}
.vol{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:12px;color:var(--mute);font-size:14px}
.vol b{font-size:32px;color:var(--plate);font-variant-numeric:tabular-nums;line-height:1.1}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1;min-width:0}
.last,.empty{color:var(--mute);font-size:14px;margin:6px 0}.err,#warn{color:var(--danger);font-size:14px;min-height:20px}
.day{margin-top:14px}.dayh{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:4px;font-weight:700}.dayh em{font-style:normal;color:var(--plate)}
.ph{margin-top:10px;font-size:13px;font-weight:700;color:var(--mute)}
.grp summary{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;list-style:none;font-weight:500}
.grp summary::-webkit-details-marker{display:none}.grp summary::before{content:"▸";color:var(--mute);transition:transform .15s}.grp[open]>summary::before{transform:rotate(90deg)}
.grp summary .gn{flex:1;padding-left:6px}.gv{color:var(--plate);font-variant-numeric:tabular-nums}
.log{display:flex;justify-content:space-between;gap:8px;padding:8px 0 8px 16px;border-bottom:1px solid var(--line)}.log small{display:block;color:var(--mute);white-space:pre-wrap;word-break:break-word}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.dlg h2{margin-bottom:10px}.dlg label{margin-top:10px}.pre{white-space:pre-line;margin:0 0 6px}.btns{margin-top:14px}
.ct{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;margin-top:8px}.ct th,.ct td{padding:7px 3px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}.ct th{color:var(--mute);font-size:13px}.ct th:first-child,.ct td:first-child{text-align:left}.ct tr.me td{background:var(--bg);font-weight:700}
.cmp{border-radius:10px;padding:10px 12px;margin:-4px 0 12px;font-size:14px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}.cmp:empty{display:none}.cmp b{color:var(--ink)}.cmp b.no{color:var(--plate)}.cmp .ok b{color:var(--acc)}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-130%);background:var(--acc);color:var(--acc-ink);padding:6px 14px;border-radius:16px;font-weight:700}
</style>
</head>
<body>
<main>
<button class="cmp" id="bakTop" type="button" hidden style="width:100%;text-align:left;margin:0 0 12px">⚠ 超過 7 天沒備份了，點這裡前往備份</button>
<div class="tabs" id="tabs"></div>

<section>
  <div class="sh"><h2>運動項目</h2><span><button class="link" id="catBtn" type="button">管理分類</button><button class="link" id="orgBtn" type="button">拖移整理</button></span></div>
  <div id="chips"></div>
  <button id="addBtn" type="button" style="width:100%;margin-top:8px">＋ 新增項目</button>
</section>

<section id="entry">
  <div class="sh"><h2 id="eName"></h2><button class="link" id="manage" type="button">管理</button></div>
  <p class="last" id="last"></p>
  <div class="seg" id="unitSeg"><button type="button" data-u="kg">公斤 kg</button><button type="button" data-u="lb">磅 lb</button></div>
  <div class="steps" id="steps"></div>
  <div class="vol"><span>總容量（已換算公斤）</span><b id="preview">0 kg</b></div>
  <div class="cmp" id="cmp"></div>
  <button class="link" id="calcBtn" type="button" style="margin:-6px 0 6px -8px">換重量，總容量要做幾下？</button>
  <label for="note">當下狀況備註（選填）</label>
  <input id="note" type="text" placeholder="例如：右肩有點緊">
  <div style="margin-top:10px"><label for="date">日期</label><input id="date" type="date"></div>
  <div id="warn" role="alert"></div>
  <button class="main" id="save" type="button" style="width:100%;min-height:52px;font-size:17px">儲存這筆紀錄</button>
</section>

<section>
  <div class="sh"><h2>歷史紀錄</h2><div class="seg" id="mSeg"><button type="button" data-m="kg">總公斤</button><button type="button" data-m="sets">總組數</button></div></div>
  <div class="seg" id="hSeg" style="margin-bottom:6px"><button type="button" data-o="0" class="on">全部</button><button type="button" data-o="1">只看此項目</button></div>
  <div id="hist"></div>
</section>

<section id="bakSec">
  <div class="sh"><h2>資料備份</h2></div>
  <p class="last" id="bakInfo"></p>
  <div class="row"><button id="exp" type="button">匯出備份</button><button id="imp" type="button">匯入備份</button></div>
  <input id="impf" type="file" accept="application/json,.json" hidden>
</section>
</main>

<script>
(()=>{
const KEY="workout-log-v1",LB=0.45359237;
let S={exercises:[],logs:[],last:"",day:""},U="kg",org=false,only=false;const open={};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.exercises&&p.logs)S=p;}}catch(e){}
if(!S.day)S.day=S.exercises.length?"other":"chest";
function DEFP(){return [["shoulder","肩"],["chest","胸"],["tri","三頭"],["other","其他"]];}
if(!Array.isArray(S.parts))S.parts=DEFP();if(!S.metric)S.metric="kg";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("en-US");
const toKg=(w,u)=>u==="lb"?w*LB:w,vol=l=>l.weight*l.reps*l.sets;
const DAYS=[["chest","胸日"],["back","背日"],["legs","腿日"],["other","其他"]];
let PARTS=S.parts;
const nLen=s=>Array.from(s).length;
const guess=n=>{const p=PARTS.filter(x=>x[0]!=="other"&&n.includes(x[1])).sort((a,b)=>nLen(b[1])-nLen(a[1]))[0];return p?p[0]:"";};
const exDay=e=>e.day||"other",exPart=e=>{const k=e.part||guess(e.name);return PARTS.some(p=>p[0]===k)?k:"other";};
const exById=id=>S.exercises.find(x=>x.id===id),exName=id=>(exById(id)||{}).name||"";
const pIdx=k=>Math.max(0,PARTS.findIndex(p=>p[0]===k));
const byLen=(a,b)=>nLen(a.name)-nLen(b.name)||a.name.localeCompare(b.name,"zh-Hant");
const dayEx=()=>S.exercises.filter(e=>exDay(e)===S.day).sort(byLen);
const cur=()=>{const l=dayEx();return l.find(e=>e.id===S.last)||l[0]||null;};
const h=(t,a={},c=[])=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}c.flat().forEach(x=>{if(x)e.appendChild(typeof x==="string"?document.createTextNode(x):x);});return e;};
function modal(title,body,btns){
  const ov=h("div",{class:"ov"});
  const close=()=>{document.removeEventListener("keydown",esc);ov.remove();};
  const esc=e=>{if(e.key==="Escape")close();};
  const d=h("div",{class:"dlg",role:"dialog"},[title&&h("h2",{text:title}),body,h("div",{class:"row btns"},btns.map(b=>h("button",{type:"button",class:b.c||"",text:b.t,onclick:()=>{if(b.f&&b.f()===false)return;close();}})))]);
  ov.addEventListener("click",e=>{if(e.target===ov)close();});document.addEventListener("keydown",esc);
  ov.appendChild(d);document.body.appendChild(ov);const f=d.querySelector("input,select");if(f)f.focus();
}
const ask=(msg,fn,label,danger=true)=>modal("",[h("p",{class:"pre",text:msg})],[{t:"取消"},{t:label||"確定刪除",c:danger?"danger":"main",f:()=>{fn();}}]);
const opts=(arr)=>arr.map(([k,t])=>h("option",{value:k,text:t}));

/* 輸入區 */
const upd=()=>{$("preview").textContent=fmt(toKg(parseFloat($("w").value)||0,U)*(parseFloat($("r").value)||0)*(parseFloat($("s").value)||0))+" kg";cmp();};
function stepper(id,lab,step){
  const i=h("input",{id,type:"number",inputmode:id==="w"?"decimal":"numeric",min:"0",step:"any"});i.addEventListener("input",upd);
  const adj=d=>{i.value=Math.max(0,Math.round(((parseFloat(i.value)||0)+d)*100)/100);upd();};
  const st=()=>typeof step==="function"?step():step;
  return h("div",{},[h("label",{for:id,text:lab}),h("div",{class:"stb"},[h("button",{type:"button","aria-label":"減少",text:"−",onclick:()=>adj(-st())}),i,h("button",{type:"button","aria-label":"增加",text:"+",onclick:()=>adj(st())})])]);
}
$("steps").append(stepper("w","重量",()=>U==="lb"?5:2.5),stepper("r","次數",1),stepper("s","組數",1));
function setUnit(u,conv=true){
  const i=$("w"),v=parseFloat(i.value);
  if(conv&&!isNaN(v)&&u!==U){const kg=toKg(v,U);i.value=Math.round((u==="lb"?kg/LB:kg)*10)/10;}
  U=u;document.querySelectorAll("#unitSeg button").forEach(b=>b.classList.toggle("on",b.dataset.u===u));upd();
}
document.querySelectorAll("#unitSeg button").forEach(b=>b.addEventListener("click",()=>setUnit(b.dataset.u)));
function prefill(){
  const c=cur(),l=c&&S.logs.filter(x=>x.exId===c.id).sort((a,b)=>b.ts-a.ts)[0];
  $("note").value="";$("warn").textContent="";
  if(l){setUnit(l.u||"kg",false);$("w").value=l.ow!=null?l.ow:l.weight;$("r").value=l.reps;$("s").value=l.sets;}
  else{$("w").value="";$("r").value="";$("s").value="";setUnit(U,false);}
  $("last").textContent=l?`上次 ${l.date}：${l.ow!=null?fmt(l.ow)+" "+(l.u||"kg"):fmt(l.weight)+" kg"} × ${l.reps} × ${l.sets}，已帶入`:"這個項目還沒有紀錄";upd();
}
$("save").onclick=()=>{
  const c=cur(),w=parseFloat($("w").value),r=parseInt($("r").value,10),s=parseInt($("s").value,10);
  if(!c||isNaN(w)||w<0||!(r>0)||!(s>0)){$("warn").textContent="請填入重量、次數與組數。";return;}
  $("warn").textContent="";
  ask(`確定儲存這筆紀錄？\n${c.name}\n${fmt(w)} ${U} × ${r} 次 × ${s} 組\n總容量 ${fmt(toKg(w,U)*r*s)} kg`,()=>{
    S.logs.push({id:uid(),exId:c.id,date:$("date").value||today(),weight:toKg(w,U),ow:w,u:U,reps:r,sets:s,note:$("note").value.trim(),ts:Date.now()});
    save();$("note").value="";soft();
  },"確定儲存",false);
};

/* 換重量計算 */
$("calcBtn").onclick=()=>{
  const f=(id,l,v)=>h("div",{},[h("label",{for:id,text:l}),h("input",{id,type:"number",inputmode:"decimal",min:"0",value:v||""})]);
  const us=(id,v)=>{const s=h("select",{id},opts([["lb","lb"],["kg","kg"]]));s.value=v;return s;};
  const out=h("div"),cu=us("cu",U),tu=us("tu",U);
  const box=h("div",{},[h("div",{class:"row"},[f("cw","原本重量",$("w").value),h("div",{style:"flex:none;width:84px"},[h("label",{for:"cu",text:"單位"}),cu])]),
    h("div",{class:"row",style:"margin-top:8px"},[f("cr","原本次數",$("r").value),f("cs","原本組數",$("s").value)]),
    h("div",{class:"row",style:"margin-top:8px"},[f("tw","想換成的重量"),h("div",{style:"flex:none;width:84px"},[h("label",{for:"tu",text:"單位"}),tu])]),out]);
  const run=()=>{
    const cw=parseFloat($("cw").value),cr=parseInt($("cr").value,10),cs=parseInt($("cs").value,10),tw=parseFloat($("tw").value);
    out.innerHTML="";
    if(!(cw>0&&cr>0&&cs>0&&tw>0)){out.appendChild(h("p",{class:"empty",text:"填入原本的數字，再輸入想換成的重量。"}));return;}
    const V=toKg(cw,cu.value)*cr*cs,tk=toKg(tw,tu.value),tot=Math.ceil(V/tk-1e-9);
    const rows=[1,2,3,4,5,6].map(s=>{const per=Math.ceil(V/(tk*s)-1e-9),v=tk*per*s,d=v-V;
      return h("tr",{class:s===cs?"me":""},[h("td",{text:s+" 組"}),h("td",{text:per+" 下"}),h("td",{text:fmt(v)+" kg"}),h("td",{text:(d>=0?"+":"")+fmt(d)+" kg（"+(d>=0?"+":"")+Math.round(d/V*1000)/10+"%）"})]);});
    out.append(h("p",{class:"pre",style:"margin-top:12px",text:`原本總容量 ${fmt(V)} kg。換成 ${fmt(tw)} ${tu.value} 後，不分組總共至少 ${tot} 下。`}),
      h("div",{style:"overflow-x:auto"},[h("table",{class:"ct"},[h("tr",{},["組數","每組至少","總容量","與原本差"].map(t=>h("th",{text:t}))),rows])]));
  };
  box.addEventListener("input",run);box.addEventListener("change",run);
  modal("換重量計算",[box],[{t:"關閉",c:"main"}]);run();
};

/* 項目 */
function drag(ev,id){
  ev.preventDefault();let hot=null;const g=h("div",{class:"ghost",text:exName(id)});document.body.appendChild(g);
  const mv=e=>{g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";const t=document.elementFromPoint(e.clientX,e.clientY),z=t&&t.closest(".prow");if(hot&&hot!==z)hot.classList.remove("hot");if(z)z.classList.add("hot");hot=z;};
  const end=e=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",end);removeEventListener("pointercancel",end);g.remove();
    const k=hot&&e.type==="pointerup"?hot.dataset.part:null,x=exById(id);if(k&&x&&exPart(x)!==k){x.part=k;save();}soft();};
  addEventListener("pointermove",mv);addEventListener("pointerup",end);addEventListener("pointercancel",end);mv(ev);
}
function renderChips(){
  const box=$("chips");box.innerHTML="";box.className=org?"org":"";const list=dayEx(),c=cur();
  PARTS.forEach(([k,n])=>{const g=list.filter(e=>exPart(e)===k);if(!g.length&&!org)return;
    box.appendChild(h("div",{class:"prow","data-part":k},[h("div",{class:"pl",text:n}),h("div",{class:"cw"},g.map(e=>
      h("button",{type:"button",class:"chip"+(c&&c.id===e.id?" on":""),text:e.name,onclick:()=>{if(!org){S.last=e.id;save();full();}},onpointerdown:ev=>{if(org)drag(ev,e.id);}})))]));});
  if(!list.length&&!org)box.appendChild(h("p",{class:"empty",text:"這個訓練日還沒有項目，按下方「新增項目」開始。"}));
  $("orgBtn").textContent=org?"完成整理":"拖移整理";
}
$("orgBtn").onclick=()=>{org=!org;renderChips();};
$("catBtn").onclick=()=>{
  const rows=PARTS.map(([k,n])=>({k,i:h("input",{type:"text",maxlength:"12",value:n}),del:false}));
  const list=h("div"),add=h("input",{type:"text",maxlength:"12",placeholder:"新分類名稱，例如：二頭"}),er=h("div",{class:"err"});
  const draw=()=>{list.innerHTML="";rows.forEach(r=>{if(r.del)return;list.appendChild(h("div",{class:"row",style:"margin-top:8px"},[r.i,r.k==="other"?h("span",{class:"empty",style:"flex:none",text:"預設"}):h("button",{type:"button",class:"dl",style:"flex:none;margin:0",text:"刪除",onclick:()=>{r.del=true;draw();}})]));});};
  draw();
  modal("管理分類",[list,h("label",{text:"新增分類"}),add,er],[{t:"取消"},{t:"儲存",c:"main",f:()=>{
    const keep=rows.filter(r=>!r.del),names=keep.map(r=>r.i.value.trim()),nn=add.value.trim(),all=nn?names.concat(nn):names;
    if(names.some(x=>!x)){er.textContent="分類名稱不能空白。";return false;}
    if(new Set(all).size!==all.length){er.textContent="分類名稱不能重複。";return false;}
    const np=keep.map((r,i)=>[r.k,names[i]]);
    if(nn)np.splice(np.length-1,0,["p_"+uid(),nn]);
    PARTS.length=0;np.forEach(x=>PARTS.push(x));save();full();}}]);
};
$("addBtn").onclick=()=>{
  const n=h("input",{type:"text",maxlength:"40",placeholder:"例如：滑輪下拉"}),p=h("select",{},[h("option",{value:"",text:"自動（依名稱判斷）"}),opts(PARTS)]),er=h("div",{class:"err"});
  modal("新增項目（"+label(DAYS,S.day)+"）",[h("label",{text:"名稱"}),n,h("label",{text:"部位"}),p,er],[{t:"取消"},{t:"新增",c:"main",f:()=>{
    const name=n.value.trim();if(!name){er.textContent="請輸入名稱。";return false;}
    let e=S.exercises.find(x=>x.name===name&&exDay(x)===S.day);
    if(!e){e={id:uid(),name,day:S.day,part:p.value||guess(name)||"other"};S.exercises.push(e);}
    S.last=e.id;save();full();}}]);
};
const label=(arr,k)=>(arr.find(x=>x[0]===k)||arr[arr.length-1])[1];
$("manage").onclick=()=>{
  const e=cur();if(!e)return;
  const n=h("input",{type:"text",maxlength:"40",value:e.name}),p=h("select",{},opts(PARTS)),d=h("select",{},opts(DAYS)),er=h("div",{class:"err"});p.value=exPart(e);d.value=exDay(e);
  modal("管理項目",[h("label",{text:"名稱"}),n,h("label",{text:"部位"}),p,h("label",{text:"所屬訓練日"}),d,er],[
    {t:"刪除項目",c:"dl",f:()=>{const cnt=S.logs.filter(l=>l.exId===e.id).length;
      ask(`刪除「${e.name}」${cnt?"與其 "+cnt+" 筆紀錄":""}？此動作無法復原。`,()=>{S.exercises=S.exercises.filter(x=>x.id!==e.id);S.logs=S.logs.filter(l=>l.exId!==e.id);S.last="";save();full();});}},
    {t:"取消"},
    {t:"儲存",c:"main",f:()=>{const name=n.value.trim();
      if(!name){er.textContent="名稱不能空白。";return false;}
      if(S.exercises.some(x=>x.id!==e.id&&x.name===name&&exDay(x)===d.value)){er.textContent="該訓練日已有同名項目。";return false;}
      e.name=name;e.part=p.value;e.day=d.value;S.day=d.value;S.last=e.id;save();full();}}]);
};

const mv=arr=>S.metric==="sets"?arr.reduce((a,l)=>a+l.sets,0)+" 組":fmt(arr.reduce((a,l)=>a+vol(l),0))+" kg";
function editLog(l){
  const num=(lab,v)=>{const i=h("input",{type:"number",inputmode:"decimal",min:"0",step:"any",value:String(v)});return {i,n:h("div",{},[h("label",{text:lab}),i])};};
  const W=num("重量",l.ow!=null?l.ow:l.weight),R=num("次數",l.reps),T=num("組數",l.sets);
  const u=h("select",{},opts([["kg","kg"],["lb","lb"]]));u.value=l.u||"kg";
  const dt=h("input",{type:"date",value:l.date}),nt=h("input",{type:"text",value:l.note||""}),er=h("div",{class:"err"});
  modal("編輯："+exName(l.exId),[h("div",{class:"row"},[W.n,h("div",{style:"flex:none;width:84px"},[h("label",{text:"單位"}),u])]),h("div",{class:"row",style:"margin-top:8px"},[R.n,T.n]),h("label",{text:"日期"}),dt,h("label",{text:"備註"}),nt,er],[{t:"取消"},{t:"儲存",c:"main",f:()=>{
    const w=parseFloat(W.i.value),r=parseInt(R.i.value,10),s=parseInt(T.i.value,10);
    if(isNaN(w)||w<0||!(r>0)||!(s>0)||!dt.value){er.textContent="請填入重量、次數、組數與日期。";return false;}
    l.weight=toKg(w,u.value);l.ow=w;l.u=u.value;l.reps=r;l.sets=s;l.date=dt.value;l.note=nt.value.trim();save();soft();}}]);
}
/* 歷史 */
function renderHist(){
  const box=$("hist");box.innerHTML="";const c=cur(),ids=dayEx().map(e=>e.id);
  const logs=S.logs.filter(l=>only&&c?l.exId===c.id:ids.includes(l.exId));
  if(!logs.length){box.appendChild(h("p",{class:"empty",text:"還沒有紀錄。填好上方數字後儲存第一筆。"}));return;}
  const days={};logs.forEach(l=>(days[l.date]=days[l.date]||[]).push(l));
  Object.keys(days).sort().reverse().forEach(d=>{
    const arr=days[d].sort((a,b)=>a.ts-b.ts),by={},order=[];
    arr.forEach(l=>{if(!by[l.exId]){by[l.exId]=[];order.push(l.exId);}by[l.exId].push(l);});
    order.sort((a,b)=>pIdx(exPart(exById(a)||{name:""}))-pIdx(exPart(exById(b)||{name:""}))||nLen(exName(a))-nLen(exName(b)));
    const day=h("div",{class:"day"},[h("div",{class:"dayh"},[h("span",{text:d}),h("em",{text:"當日 "+mv(arr)})])]);
    let lp="";
    order.forEach(eid=>{
      const pk=exPart(exById(eid)||{name:""}),items=by[eid],key=d+"|"+eid;
      if(pk!==lp){day.appendChild(h("div",{class:"ph",text:label(PARTS,pk)}));lp=pk;}
      const det=h("details",{class:"grp"},[h("summary",{},[h("span",{class:"gn",text:exName(eid)}),h("span",{class:"gv",text:mv(items)})])]);
      det.open=!!open[key];det.addEventListener("toggle",()=>{if(det.open)open[key]=1;else delete open[key];});
      items.forEach(l=>det.appendChild(h("div",{class:"log"},[
        h("div",{},[h("div",{text:(l.u==="lb"?`${fmt(l.ow)} lb（${fmt(l.weight)} kg）`:`${fmt(l.weight)} kg`)+` × ${l.reps} 次 × ${l.sets} 組 = ${fmt(vol(l))} kg`}),l.note&&h("small",{text:l.note})]),
        h("div",{style:"display:flex;flex:none"},[
          h("button",{type:"button",class:"link",text:"編輯",onclick:()=>editLog(l)}),
          h("button",{type:"button",class:"link",text:"刪除",onclick:()=>ask("確定刪除這筆紀錄？",()=>{S.logs=S.logs.filter(x=>x.id!==l.id);save();soft();})})])])));
      day.appendChild(det);
    });
    box.appendChild(day);
  });
}
document.querySelectorAll("#hSeg button").forEach(b=>b.addEventListener("click",()=>{only=b.dataset.o==="1";document.querySelectorAll("#hSeg button").forEach(x=>x.classList.toggle("on",x===b));renderHist();}));

/* 和上次比較、顯示方式、備份 */
function cmp(){
  const box=$("cmp"),c=cur();box.innerHTML="";if(!c)return;
  const d=$("date").value||today(),mine=S.logs.filter(l=>l.exId===c.id);
  const prev=mine.filter(l=>l.date<d).sort((a,b)=>a.date<b.date?1:-1);
  if(!prev.length)return;
  const pl=mine.filter(l=>l.date===prev[0].date),td=mine.filter(l=>l.date===d);
  const sum=(a,f)=>a.reduce((x,l)=>x+f(l),0),uk=U==="lb"?LB:1;
  const w=parseFloat($("w").value)||0,r=parseFloat($("r").value)||0,s=parseFloat($("s").value)||0,wk=toKg(w,U);
  const pV=sum(pl,vol),pS=sum(pl,l=>l.sets),pW=Math.max(...pl.map(l=>l.weight));
  const cV=sum(td,vol)+wk*r*s,cS=sum(td,l=>l.sets)+s,sets=S.metric==="sets";
  const diff=sets?pS-cS:pV-cV,unit=sets?" 組":" kg";
  let t=`<div>上次 ${prev[0].date}：<b>${sets?pS+" 組":fmt(pV)+" kg"}</b>，最大重量 <b>${fmt(pW/uk)} ${U}</b></div>`;
  t+=diff>1e-6?`<div>要追平上次，還差 <b class="no">${fmt(diff)}${unit}</b>`+(!sets&&wk>0?`（用 ${fmt(w)} ${U} 約再 ${Math.ceil(diff/wk-1e-9)} 下）`:"")+`</div>`:`<div class="ok"><b>已追平上次，多了 ${fmt(-diff)}${unit}</b></div>`;
  if(w>0){const dw=(wk-pW)/uk;t+=`<div>重量：${Math.abs(dw)<0.05?"和上次最大重量相同":(dw>0?"比上次高 ":"比上次低 ")+fmt(Math.abs(dw))+" "+U}</div>`;}
  box.innerHTML=t+`<div style="font-size:12px">比較已包含今天已存的紀錄與目前填的這筆</div>`;
}
function renderM(){document.querySelectorAll("#mSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===S.metric));}
document.querySelectorAll("#mSeg button").forEach(b=>b.addEventListener("click",()=>{S.metric=b.dataset.m;save();renderM();renderHist();cmp();}));
function renderBak(){
  const need=S.logs.length>0&&(!S.bak||Date.now()-S.bak>7*864e5);
  $("bakInfo").textContent=(S.bak?"上次備份："+new Date(S.bak).toLocaleDateString("zh-TW"):"尚未備份過")+"。資料只存在這個瀏覽器裡，建議每週備份一次。";
  $("bakTop").hidden=!need;
}
async function exportData(){
  const name=`workout-log-${new Date().toISOString().slice(0,10)}.json`,file=new File([JSON.stringify({app:"workout-log",v:1,data:S})],name,{type:"application/json"});
  const done=()=>{S.bak=Date.now();save();renderBak();};
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done();return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=h("a",{href:URL.createObjectURL(file),download:name});document.body.appendChild(a);a.click();a.remove();done();
}
$("exp").onclick=exportData;
$("imp").onclick=()=>$("impf").click();
$("impf").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  f.text().then(t=>{let d=null;try{d=JSON.parse(t);}catch(x){}
    const s=d&&d.data&&d.data.exercises?d.data:d;
    if(!s||!Array.isArray(s.exercises)||!Array.isArray(s.logs)){modal("匯入失敗",[h("p",{class:"pre",text:"這不是有效的備份檔。"})],[{t:"關閉",c:"main"}]);return;}
    ask(`匯入後會取代目前的資料（目前 ${S.logs.length} 筆紀錄，備份檔 ${s.logs.length} 筆）。確定嗎？`,()=>{S=s;if(!S.day)S.day="chest";if(!Array.isArray(S.parts))S.parts=DEFP();if(!S.metric)S.metric="kg";PARTS=S.parts;S.bak=Date.now();save();full();renderM();renderBak();},"確定匯入",false);});};
$("bakTop").onclick=()=>$("bakSec").scrollIntoView({behavior:"smooth"});

/* 整體 */
function renderTabs(){const t=$("tabs");t.innerHTML="";DAYS.forEach(([k,n])=>t.appendChild(h("button",{type:"button",class:k===S.day?"on":"",text:n,onclick:()=>{S.day=k;S.last="";save();full();}})));}
function renderEntry(){const c=cur();$("entry").hidden=!c;if(c){$("eName").textContent=c.name;prefill();}}
function soft(){renderChips();renderHist();cmp();renderBak();}
function full(){renderTabs();renderChips();renderEntry();renderHist();}
$("date").value=today();$("date").addEventListener("change",cmp);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
full();renderM();renderBak();
})();
</script>
